<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>算命占卜</title>
<style>
  /* 像素字体：优先使用系统等宽/像素风，失败则回退 */
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root{
    --bg1:#e6d9f7;
    --bg2:#d3bdf0;
    --bg3:#c4a8ec;
    --ink:#2b1b3d;
    --ink-soft:#4a3363;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    background-color:var(--bg1);
    /* 像素风背景：用 repeating 渐变模拟像素格 */
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.35) 0 4px, transparent 4px 8px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 4px, transparent 4px 8px),
      repeating-linear-gradient(0deg, rgba(120,80,180,.10) 0 8px, transparent 8px 16px),
      repeating-linear-gradient(90deg, rgba(120,80,180,.10) 0 8px, transparent 8px 16px),
      linear-gradient(160deg, var(--bg1), var(--bg2) 45%, var(--bg3));
    background-size: 8px 8px, 8px 8px, 16px 16px, 16px 16px, 100% 100%;
    font-family:'Press Start 2P', 'Courier New', monospace;
    color:var(--ink);
    padding:24px;
    text-align:center;
    cursor:pointer;
    user-select:none;
  }

  #stage{
    max-width:820px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    /* 给文字一个半透明浅色底，和背景明显区分，提升可读性 */
    background:rgba(255,255,255,.55);
    border:4px solid var(--ink);
    border-radius:0;              /* 像素风不要圆角 */
    padding:clamp(20px,5vw,48px) clamp(16px,5vw,56px);
    box-shadow:8px 8px 0 rgba(43,27,61,.25);
    transition:opacity .25s ease;
  }

  #mainText{
    font-size:clamp(13px, 3.4vw, 26px);
    line-height:2;
    letter-spacing:1px;
    word-break:break-word;
    text-shadow:2px 2px 0 rgba(255,255,255,.9);
  }

  #subText{
    font-size:clamp(11px, 2.6vw, 19px);
    line-height:2;
    color:var(--ink-soft);
    text-shadow:1px 1px 0 rgba(255,255,255,.9);
  }

  .num{
    color:#7b2ff7;
    font-size:1.25em;
  }

  /* 提示点击的小箭头/文字 */
  #hint{
    font-size:clamp(9px, 2vw, 14px);
    color:var(--ink-soft);
    animation:blink 1.4s steps(2, start) infinite;
  }
  @keyframes blink{ 50%{ opacity:.15; } }

  /* ====== 彩蛋层：完全黑屏 ====== */
  #egg{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:9999;
    background:#000;              /* 完全黑屏 */
    opacity:1;
    transition:opacity 1.2s ease; /* 渐隐动画 */
  }
  #egg.on{ display:block; }
  #egg.fading{ opacity:0; }       /* 消退时淡出 */

  /* 中央大字：自己的闪烁节奏 */
  .egg-big{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    color:#c40000;
    font-family:Impact, 'Arial Black', 'Helvetica Neue', sans-serif;
    font-weight:900;
    font-size:clamp(60px, 22vw, 320px);
    letter-spacing:.04em;
    white-space:nowrap;
    animation:flashBig 0.5s steps(2, start) infinite;
  }

  /* 四周小字：各自错频 */
  .egg-small{
    position:absolute;
    color:#c40000;
    font-family:Impact, 'Arial Black', sans-serif;
    font-weight:900;
    font-size:clamp(16px, 4.5vw, 56px);
    white-space:nowrap;
  }

  /* 大字节奏 */
  @keyframes flashBig{
    0%,100%{ opacity:1; }
    50%{ opacity:0; }
  }

  /* 小字通用闪烁 */
  @keyframes flashSmall{
    0%,100%{ opacity:1; }
    50%{ opacity:0; }
  }

  /* 给每个小字不同的时长与延迟，形成错频 */
  .egg-small:nth-of-type(1){ animation:flashSmall 0.55s steps(2, start) infinite; animation-delay:0s;    }
  .egg-small:nth-of-type(2){ animation:flashSmall 0.72s steps(2, start) infinite; animation-delay:-0.13s; }
  .egg-small:nth-of-type(3){ animation:flashSmall 0.43s steps(2, start) infinite; animation-delay:-0.21s; }
  .egg-small:nth-of-type(4){ animation:flashSmall 0.88s steps(2, start) infinite; animation-delay:-0.05s; }
  .egg-small:nth-of-type(5){ animation:flashSmall 0.61s steps(2, start) infinite; animation-delay:-0.34s; }
  .egg-small:nth-of-type(6){ animation:flashSmall 0.79s steps(2, start) infinite; animation-delay:-0.27s; }

  /* ====== 追加彩蛋：右下角笑脸 ====== */
  #smiley{
    position:fixed;
    right:clamp(12px, 4vw, 40px);
    bottom:clamp(12px, 4vw, 40px);
    z-index:10000;
    display:none;
    color:#c40000;
    font-family:Impact, 'Arial Black', 'Helvetica Neue', sans-serif;
    font-weight:900;
    font-size:clamp(22px, 6vw, 56px);
    line-height:1;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    text-shadow:2px 2px 0 rgba(0,0,0,.15);
  }
  #smiley.show{ display:block; }

  @media (max-width:480px){
    #stage{ gap:20px; box-shadow:5px 5px 0 rgba(43,27,61,.25); }
  }
</style>
</head>
<body>

  <div id="stage">
    <div id="mainText">
      欢迎收看「算命占卜」频道！<br>
      请点击以获知您今天的运气值。
    </div>
    <div id="subText"></div>
    <div id="hint">▲ 点击任意处</div>
  </div>

  <!-- 彩蛋层 -->
  <div id="egg">
    <div class="egg-big">TIME IS ？</div>
    <div class="egg-small" style="left:6%;  top:8%;">TIME IS ？</div>
    <div class="egg-small" style="right:6%; top:12%;">TIME IS ？</div>
    <div class="egg-small" style="left:10%; bottom:10%;">TIME IS ？</div>
    <div class="egg-small" style="right:8%; bottom:14%;">TIME IS ？</div>
    <div class="egg-small" style="left:50%; top:4%;  transform:translateX(-50%);">TIME IS ？</div>
    <div class="egg-small" style="left:50%; bottom:4%; transform:translateX(-50%);">TIME IS ？</div>
  </div>

  <!-- 追加彩蛋：右下角笑脸 -->
  <div id="smiley">:-)</div>

<script>
(function(){
  // ============ 1. 北京时间 & 每日固定随机数 ============
  function beijingDateKey(){
    // 用 UTC 时间 + 8 小时得到北京时间
    const now = new Date();
    const bj = new Date(now.getTime() + (8 * 60 * 60 * 1000));
    const y = bj.getUTCFullYear();
    const m = String(bj.getUTCMonth() + 1).padStart(2, '0');
    const d = String(bj.getUTCDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  // 简易可复现哈希：把 日期 + 设备指纹 映射到 1-100
  function hashCode(str){
    let h = 2166136261;
    for (let i = 0; i < str.length; i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // 设备端指纹：localStorage 里存一个随机 id，保证"同一设备同一天固定"
  function getDeviceId(){
    const KEY = 'fortune_device_id';
    let id = null;
    try { id = localStorage.getItem(KEY); } catch(e){}
    if (!id){
      id = 'dev-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      try { localStorage.setItem(KEY, id); } catch(e){}
    }
    return id;
  }

  function getDailyNumber(){
    const key = beijingDateKey() + '|' + getDeviceId();
    const h = hashCode(key);
    return (h % 100) + 1;  // 1 - 100
  }

  // ============ 2. 页面逻辑 ============
  const stage    = document.getElementById('stage');
  const mainText = document.getElementById('mainText');
  const subText  = document.getElementById('subText');
  const hint     = document.getElementById('hint');
  const egg      = document.getElementById('egg');
  const smiley   = document.getElementById('smiley');

  let drawn = false;
  let eggTimer = null;
  let eggHideTimer = null;
  let idleTimer = null;
  let eggUsed = false;      // 本次进入页面是否已触发过彩蛋

  const IDLE_MS   = 20000;  // 20 秒无操作
  const EGG_SHOW  = 10000;  // 彩蛋闪烁 10 秒
  const EGG_FADE  = 1200;   // 渐隐时长，需与 CSS transition 一致

  function draw(){
    if (drawn) return;
    drawn = true;

    const n = getDailyNumber();

    mainText.innerHTML = '欢迎收看「算命占卜」频道！<br>请点击以获知您今天的运气值。';

    let branch = '';
    if (n < 50){
      branch = '虽然不算走运，但命运始终掌握在自己手上嘛。';
    } else {
      branch = '不错！精灵会为你的顺利一天祈祷的。';
    }

    subText.innerHTML =
      '您今天的运气值是「<span class="num">' + n + '</span>」！<br>' + branch;

    hint.style.display = 'none';
  }

  // 重置 20 秒无操作计时
  function resetIdle(){
    if (eggTimer) { clearTimeout(eggTimer); eggTimer = null; }
    if (idleTimer) { clearTimeout(idleTimer); }

    // 彩蛋已用过 或 正在播放，都不再重新计时
    if (eggUsed) return;
    if (egg.classList.contains('on')) return;

    idleTimer = setTimeout(showEgg, IDLE_MS);
  }

  function showEgg(){
    if (eggUsed) return;
    eggUsed = true;                 // 标记已用，退出前不再触发
    egg.classList.remove('fading');
    egg.classList.add('on');
    eggHideTimer = setTimeout(hideEgg, EGG_SHOW);
  }

  function hideEgg(){
    if (eggHideTimer) { clearTimeout(eggHideTimer); eggHideTimer = null; }
    egg.classList.add('fading');    // 开始渐隐
    setTimeout(function(){
      egg.classList.remove('on');
      egg.classList.remove('fading');
      // 黑幕完全消退后，右下角出现笑脸
      smiley.classList.add('show');
      // 本会话彩蛋已用完，不再 resetIdle()
    }, EGG_FADE);
  }

  // ============ 3. 事件绑定 ============
  // 点击抽签（点击页面任意处）
  document.addEventListener('click', function(){
    draw();
    resetIdle();
  });

  // 任何操作都算"有操作"，重置 20 秒计时（但抽签前也计时）
  ['mousemove','mousedown','touchstart','keydown','scroll','wheel'].forEach(function(ev){
    window.addEventListener(ev, resetIdle, { passive:true });
  });

  // 页面可见性：切走再回来重新计时
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) resetIdle();
  });

  // 追加彩蛋：点击笑脸变成 X-P
  smiley.addEventListener('click', function(e){
    e.stopPropagation();          // 别触发页面的抽签/重置逻辑
    smiley.textContent = 'X-P';
    smiley.style.cursor = 'default';
  });

  // 启动计时
  resetIdle();
})();
</script>
</body>
</html>
